name: sts2-main-auto-update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update-all
        run: |
          chmod +x scripts/*.sh scripts/*.py
          make update-all

      - name: Detect meaningful changes
        id: diff
        run: |
          git add -A
          git reset data/run_summary.json logs/ || true
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to main when changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git commit -m "chore(sts2): auto-update datasets/pages [$TS]"
          git push origin HEAD:main

      - name: No meaningful changes summary
        if: steps.diff.outputs.changed == 'false'
        run: echo "NO_MEANINGFUL_CHANGES"

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts2-update-artifacts
          path: |
            logs/
            data/run_summary.json
            data/change_log.json
            data/raw_sources.json
            data/*.json
