name: sts2-main-auto-update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update-all
        run: |
          chmod +x scripts/*.sh scripts/*.py
          make update-all

      - name: Detect meaningful changes (report only)
        id: diff
        run: |
          git add -A
          git reset data/run_summary.json data/cache/http_meta.json logs/ || true
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "NO_MEANINGFUL_CHANGES"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "CHANGES_DETECTED_BUT_MAIN_COMMIT_DISABLED"
          fi

      - name: No main commit mode (Netlify-safe)
        run: |
          echo "Auto-commit to main is disabled to avoid Netlify deploy/token usage."
          echo "Use external data feed updates for freshness without deployments."

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts2-update-artifacts
          path: |
            logs/
            data/run_summary.json
            data/change_log.json
            data/raw_sources.json
            data/*.json
